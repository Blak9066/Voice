name: Build VoiceBridge APK
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          mkdir -p source
          unzip -o VoiceBridge-GitHub-Upload.zip -d source
          test -f source/app/pubspec.yaml
          test -f source/app/lib/main.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Create Android project from source
        run: |
          flutter create --org me.voicebridge --project-name voicebridge_app --platforms=android build_app
          rm -rf build_app/lib
          cp -r source/app/lib build_app/lib
          cp source/app/pubspec.yaml build_app/pubspec.yaml
          # Keep the legacy record API, but use a Linux implementation compatible
          # with the newer record_platform_interface selected by Pub.
          python3 - <<'PY'
          from pathlib import Path
          import re

          pubspec = Path("build_app/pubspec.yaml")
          text = pubspec.read_text()
          override = "  record_linux: ^1.3.1"
          if re.search(r"(?m)^dependency_overrides:\s*$", text):
              if not re.search(r"(?m)^  record_linux\s*:", text):
                  text = re.sub(r"(?m)^(dependency_overrides:\s*)$", r"\1\n" + override, text, count=1)
          else:
              text = text.rstrip() + "\n\ndependency_overrides:\n" + override + "\n"
          pubspec.write_text(text)
          print("Pinned record_linux to a version compatible with record_platform_interface")
          PY
          python3 source/.github/scripts/patch_android.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("build_app/android/app/build.gradle"),
              Path("build_app/android/app/build.gradle.kts"),
          ]
          app_gradle = next((p for p in candidates if p.exists()), None)
          if app_gradle is None:
              raise SystemExit("Could not find Android app Gradle build file")

          text = app_gradle.read_text()
          text, count1 = re.subn(r"(?m)^(\s*minSdkVersion\s+).+$", r"\g<1>21", text)
          text, count2 = re.subn(r"(?m)^(\s*minSdk\s*=\s*).+$", r"\g<1>21", text)
          text, count3 = re.subn(r"(?m)^(\s*compileSdkVersion\s+).+$", r"\g<1>36", text)
          text, count4 = re.subn(r"(?m)^(\s*compileSdk\s*=\s*).+$", r"\g<1>36", text)
          if count1 + count2 == 0:
              raise SystemExit("Could not find minSdk setting in " + str(app_gradle))
          if count3 + count4 == 0:
              raise SystemExit("Could not find compileSdk setting in " + str(app_gradle))
          app_gradle.write_text(text)
          if not re.search(r"(?m)^\s*minSdk(?:Version)?\s*(?:=\s*)?21\s*$", text):
              raise SystemExit("Failed to set Android minSdk to 21")
          if not re.search(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$", text):
              raise SystemExit("Failed to set Android compileSdk to 36")
          print("Configured Android minSdk=21 and compileSdk=36 in", app_gradle)

          props = Path("build_app/android/gradle.properties")
          existing = props.read_text() if props.exists() else ""
          setting = "android.ndk.suppressMinSdkVersionError=21"
          if setting not in existing:
              props.write_text(existing.rstrip() + "\n" + setting + "\n")
          PY
      - name: Install required Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBridge-app-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
