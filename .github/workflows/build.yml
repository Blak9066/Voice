name: Build VoiceBridge Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/patch_android.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create Android project and copy app source
        run: |
          flutter create --org me.voicebridge --project-name voicebridge_app --platforms=android build_app
          rm -rf build_app/lib
          cp -r app/lib build_app/lib
          cp app/pubspec.yaml build_app/pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("build_app/pubspec.yaml")
          t = p.read_text()
          override = "  record_linux: ^1.3.1"
          if re.search(r"(?m)^dependency_overrides:\\s*$", t):
              if not re.search(r"(?m)^  record_linux\\s*:", t):
                  t = re.sub(r"(?m)^(dependency_overrides:\\s*)$", r"\\1\\n" + override, t, count=1)
          else:
              t = t.rstrip() + "\\n\\ndependency_overrides:\\n" + override + "\\n"
          p.write_text(t)
          PY
          python3 .github/scripts/patch_android.py

      - name: Install required Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Patch older plugin Android SDK settings
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          root = cache / "hosted" / "pub.dev"
          patched = []
          if root.exists():
              for p in list(root.glob("*/android/build.gradle")) + list(root.glob("*/android/build.gradle.kts")):
                  old = p.read_text()
                  new = re.sub(r"(?m)^(\\s*compileSdkVersion\\s+)33(\\s*(?://.*)?$)", lambda m: m.group(1) + "36" + m.group(2), old)
                  new = re.sub(r"(?m)^(\\s*compileSdk\\s*=\\s*)33(\\s*(?://.*)?$)", lambda m: m.group(1) + "36" + m.group(2), new)
                  if new != old:
                      p.write_text(new)
                      patched.append(str(p))
          print("Patched plugin SDK declarations:", patched)
          PY

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceBridge-Android-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
